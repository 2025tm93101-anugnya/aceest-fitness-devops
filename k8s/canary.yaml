apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:v1
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0-STABLE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:v2
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "2.0-CANARY"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-svc
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
    - port: 80
      targetPort: 5000
