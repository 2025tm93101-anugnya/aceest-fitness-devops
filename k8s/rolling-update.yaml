apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app: aceest-rolling
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:latest
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling-svc
spec:
  type: NodePort
  selector:
    app: aceest-rolling
  ports:
    - port: 80
      targetPort: 5000
