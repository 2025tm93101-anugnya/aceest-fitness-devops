apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      color: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        color: blue
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:v1
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "1.0-BLUE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      color: green
  template:
    metadata:
      labels:
        app: aceest-bg
        color: green
    spec:
      containers:
        - name: aceest
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:v2
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "2.0-GREEN"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg-svc
spec:
  type: NodePort
  selector:
    app: aceest-bg
    color: blue
  ports:
    - port: 80
      targetPort: 5000
